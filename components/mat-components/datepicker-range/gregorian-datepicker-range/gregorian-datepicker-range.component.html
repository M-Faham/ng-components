<form [formGroup]="dateRangeForm">
  <div>
    <mat-form-field class="w-100" appearance="outline">
      <mat-date-range-input
        (click)="open()"
        [rangePicker]="pickerGregorian"
        [min]="min()"
        [max]="max()"
      >
        <input
          [placeholder]="placeholderFrom()"
          matStartDate
          formControlName="startDate"
        />
        <input
          [placeholder]="placeholderTo()"
          matEndDate
          formControlName="endDate"
        />
      </mat-date-range-input>
      @if (showSwitchToHijriIcon()) {
        <mat-datepicker-toggle (click)="switchToHijri()" matIconSuffix>
          <div class="text-toggler" matDatepickerToggleIcon>
            <span class="text fw-bolder">ميلادي</span>
          </div>
        </mat-datepicker-toggle>
      }
      <mat-date-range-picker #pickerGregorian></mat-date-range-picker>
    </mat-form-field>
  </div>
</form>
