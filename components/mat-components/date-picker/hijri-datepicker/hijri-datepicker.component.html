<!-- Variables: -->
@let dateCtrl = dateForm.controls['date'];

<form [formGroup]="dateForm" class="filter-date">
  <mat-form-field class="w-100" appearance="outline" (click)="open()">
    <input
      matInput
      [class.ng-touched]="touched"
      placeholder="{{ placeholder() }}"
      formControlName="date"
      (blur)="markAsTouched()"
      [min]="min()"
      [max]="max()"
      [matDatepicker]="pickerHijri"
    />
    @if (showSwitchToGregorianIcon()) {
      <mat-datepicker-toggle
        (click)="switchToGregorian(); $event.stopPropagation()"
        matIconSuffix
      >
        <div class="text-toggler" matDatepickerToggleIcon>
          <span class="text fw-bolder">هجري</span>
        </div>
      </mat-datepicker-toggle>
    }
    <mat-datepicker #pickerHijri></mat-datepicker>
    @if (dateCtrl && dateCtrl.errors) {
      <mat-error>
        {{ dateCtrl.errors | validationHandler }}
      </mat-error>
    }
  </mat-form-field>
</form>
